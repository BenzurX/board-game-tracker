<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PiP · Tracker Controls Tab</title>
<style>
  :root { --ink:#21131f; --plum:#2d202c; --deep:#1c131b; --line:#493747; --cream:#fff8e8; --marigold:#f2c94c; --marigold-bd:#ad7e12; --mint:#74c4aa; --mint-bd:#317b69; --shadow:4px 5px 0 #130d12; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; overflow:hidden; background:radial-gradient(ellipse at 15% 25%,#4b293a 0%,transparent 36%),radial-gradient(ellipse at 85% 82%,#39253c 0%,transparent 42%),var(--deep); color:var(--cream); font:700 16px/1.3 system-ui,sans-serif; }
  .device { position:relative; width:min(430px,100vw); height:min(820px,100vh); overflow:hidden; background:linear-gradient(145deg,#2d202c,#21171f); box-shadow:0 18px 70px #0008; }
  .top, .bottom { position:absolute; left:0; right:0; z-index:2; background:#342636; transition:transform .22s ease,opacity .16s ease; }
  .top { top:0; display:flex; justify-content:space-between; align-items:center; min-height:76px; padding:14px 18px; border-bottom:3px solid #21131f; }
  .brand { font-weight:1000; letter-spacing:.13em; } .gear { width:38px; height:38px; display:grid; place-items:center; border:3px solid var(--mint-bd); border-radius:10px; background:var(--mint); color:var(--ink); }
  .bottom { bottom:0; display:flex; gap:9px; padding:12px; border-top:3px solid #21131f; }
  button { font:900 13px/1 system-ui,sans-serif; letter-spacing:.06em; cursor:pointer; }
  .score { flex:2; border:3px solid var(--mint-bd); border-radius:10px; padding:15px 10px; background:var(--mint); color:var(--ink); box-shadow:var(--shadow); }
  .new { flex:1; border:3px solid var(--line); border-radius:10px; padding:15px 10px; background:#f2e8db; color:var(--ink); box-shadow:var(--shadow); }
  .board { height:100%; overflow:auto; padding:96px 14px 100px; background-image:radial-gradient(#715564 .55px,transparent .7px); background-size:3px 3px; }
  .round { display:grid; grid-template-columns:36px 1fr 1fr; min-width:330px; border:2px solid #493747; border-bottom:0; background:#30232f; }
  .round:last-child { border-bottom:2px solid #493747; }
  .round span { min-height:61px; display:grid; place-items:center; border-right:1px solid #493747; } .round span:last-child { border:0; }
  .round .number { color:#bca9b8; font-size:12px; } .round .name { font-size:13px; background:#443042; }
  .note { position:absolute; left:20px; right:68px; bottom:112px; z-index:1; padding:11px 13px; border:2px solid #60465c; border-radius:9px; color:#d7c9d4; background:#251b24cc; font-size:12px; }
  .tab { position:absolute; z-index:4; right:-2px; bottom:14px; width:50px; height:48px; display:flex; align-items:center; justify-content:center; border:3px solid var(--marigold-bd); border-right:0; border-radius:14px 0 0 14px; background:var(--marigold); color:var(--ink); box-shadow:var(--shadow); transform:translateX(0); transition:opacity .16s ease,transform .22s ease; }
  .tab svg { width:24px; } .tab:active { box-shadow:none; transform:translateY(5px); }
  .device.open .top { transform:translateY(0); opacity:1; } .device.open .bottom { transform:translateY(0); opacity:1; } .device.open .tab { opacity:0; pointer-events:none; transform:translateX(110%); }
  .device:not(.open) .top { transform:translateY(-110%); opacity:0; } .device:not(.open) .bottom { transform:translateY(110%); opacity:0; }
  .device:not(.open) .board { padding-top:18px; padding-bottom:18px; }
  .caption { position:fixed; top:12px; font-size:12px; letter-spacing:.08em; color:#c9b8c5; text-transform:uppercase; }
</style>
<p class="caption">Tap the edge tab to show controls</p>
<main class="device" id="preview" aria-label="Collapsed PiP tracker preview">
  <header class="top"><div><div class="brand">PIP · FARKLE</div><small>Round 8 · Alex's turn</small></div><div class="gear">⚙</div></header>
  <section class="board" aria-label="Scoreboard">
    <div class="round"><span class="number">#</span><span class="name">Alex</span><span class="name">Sam</span></div>
    <div class="round"><span class="number">5</span><span>6,450</span><span>6,200</span></div>
    <div class="round"><span class="number">6</span><span>7,150</span><span>6,650</span></div>
    <div class="round"><span class="number">7</span><span>7,900</span><span>7,400</span></div>
    <div class="round"><span class="number">8</span><span>·</span><span>·</span></div>
  </section>
  <p class="note">Controls stay hidden while you scroll. Use this tab when you want them back.</p>
  <button class="tab" id="tab" aria-label="Show tracker controls" style="font-size:1.55rem">☰</button>
  <footer class="bottom"><button class="score">ENTER SCORE</button><button class="new">NEW GAME</button></footer>
</main>
<script>
  const preview = document.querySelector('#preview');
  document.querySelector('#tab').addEventListener('click', () => {
    preview.classList.add('open');
    setTimeout(() => preview.classList.remove('open'), 3000);
  });
</script>
</html>
